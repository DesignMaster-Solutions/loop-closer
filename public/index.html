<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop Closer · every actionable screening result reaches care</title>
<meta name="description" content="Prototype for the Future Health Digital Innovation Challenge (Population Health 05): case visibility, ownership, SLAs, patient messages in English and Arabic, and clinician-only closure.">
<style>
  :root { --ink:#13212b; --mute:#5b6b75; --line:#d9e1e5; --bg:#f6f8f7; --teal:#0f766e; --red:#b42318; --amber:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:20px 24px 12px; border-bottom:1px solid var(--line); background:#fff; }
  h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; color:var(--mute); }
  .kpis { display:flex; gap:24px; flex-wrap:wrap; padding:14px 24px; }
  .kpi b { display:block; font-size:22px; } .kpi span { color:var(--mute); font-size:13px; }
  main { display:grid; grid-template-columns:minmax(300px, 420px) 1fr; gap:16px; padding:0 24px 24px; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  .row { display:block; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:none; padding:10px 4px; cursor:pointer; font:inherit; color:inherit; }
  .row:hover, .row[aria-current=true] { background:#eef5f4; }
  .row small { color:var(--mute); display:block; }
  .tag { display:inline-block; font-size:12px; padding:1px 7px; border-radius:10px; margin-right:4px; background:#eef1f3; }
  .tag.escalate { background:#fde8e6; color:var(--red); } .tag.overdue { background:#fdf0e1; color:var(--amber); }
  .tag.referral-rejected { background:#fde8e6; color:var(--red); }
  .tag.consult-waiting { background:#fdf0e1; color:var(--amber); }
  .tag.result-corrected { background:#fde8e6; color:var(--red); }
  #feed { margin:0 24px 16px; }
  #feed .btns { display:flex; flex-wrap:wrap; gap:8px; }
  #feed pre.msg { font:12px/1.45 ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; max-height:180px; overflow:auto; margin:10px 0 0; }
  #feed .out { margin:8px 0 0; }
  ol.tl { list-style:none; margin:0; padding:0; }
  ol.tl li { padding:6px 0 6px 22px; position:relative; border-left:2px solid var(--line); margin-left:6px; }
  ol.tl li::before { content:""; position:absolute; left:-7px; top:10px; width:12px; height:12px; border-radius:50%; background:var(--line); }
  ol.tl li.done::before { background:var(--teal); } ol.tl li.now::before { background:var(--amber); }
  ol.tl small { color:var(--mute); }
  pre { white-space:pre-wrap; background:#f3f6f5; padding:10px; border-radius:6px; font:14px/1.5 system-ui, sans-serif; }
  pre[lang=ar] { direction:rtl; text-align:right; }
  .note { color:var(--mute); font-size:13px; }
  button.act { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--teal); background:var(--teal); color:#fff; cursor:pointer; }
  button.act.alt { background:#fff; color:var(--teal); }
  button.act[disabled] { opacity:.45; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>Loop Closer</h1>
  <p>Every actionable screening result has an owner, a due date and a documented closure. Simulated cohort, no real patient data.</p>
</header>
<div class="kpis" id="kpis"></div>
<p class="note" id="scenario" style="margin:0;padding:0 24px 14px"></p>
<section id="feed">
  <h2>Lab feed <span class="note">HL7 v2 and FHIR R4, test messages only. Nothing leaves this page.</span></h2>
  <div class="btns">
    <button class="act alt" data-feed="hl7">Receive HL7 v2 result (positive FIT)</button>
    <button class="act alt" data-feed="fhir">Receive FHIR result (HbA1c 7.9%)</button>
    <button class="act alt" data-feed="again">Lab resends the same message</button>
    <button class="act alt" data-feed="corrected">Lab corrects the FIT to negative</button>
    <button class="act alt" data-feed="unknown">Result with no rule</button>
    <button class="act alt" data-feed="reconcile">Reconcile against the lab list</button>
  </div>
  <p class="out" id="feed-out" aria-live="polite"></p>
  <pre class="msg" id="feed-msg" hidden></pre>
</section>
<main>
  <section>
    <h2>Needs a human today <span class="note" id="count"></span></h2>
    <div id="list"></div>
  </section>
  <section id="detail"><p class="note">Pick a case.</p></section>
</main>
<script type="module">
import { STEPS, status, canClose, close, worklist, patientMessage, metrics, requestConsult, answerConsult } from './loop.mjs';
import { cohort, routingFor } from './cases.mjs';
import { parseMessage, ingest, reconcile, feedHealth, toFhirBundle } from './interop.mjs';

const NOW = '2026-11-15T09:00:00Z';
let cases = cohort(NOW);
const before = metrics(cases, NOW), after = metrics(cohort(NOW, 60, 7, 0.8), NOW);
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (ch) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
const day = (iso) => iso ? iso.slice(0, 10) : '';

function render(sel) {
  const m = metrics(cases, NOW);
  $('#kpis').innerHTML = [
    [m.total, 'actionable results'], [m.closed, 'closed with evidence'], [m.overdue, 'overdue now'],
    [m.medianDaysToSpecialist?.toFixed(0) ?? '-', 'median days to specialist'],
    [m.notifiedPct + '%', 'notified'], [m.acknowledgedPct + '%', 'understood'], [m.referralCompletionPct + '%', 'referrals completed'],
  ].map(([v, l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
  $('#scenario').innerHTML = `<b>Simulated scenario, same 60 cases:</b> left silent, ${before.closed} closed and ${before.stalled} stalled unseen
    (${Object.entries(before.stallReasons).map(([k, v]) => `${v} ${esc(k)}`).join(', ')}). With the worklist, assuming coordinators resolve 80% of exceptions two days after the breach,
    ${after.closed} closed and ${after.stalled} stalled. This is a model of the drop-offs, not a measured outcome.`;
  const wl = worklist(cases, NOW);
  $('#count').textContent = `(${wl.length})`;
  $('#list').innerHTML = wl.map(({ c, s }) => `<button class="row" data-id="${c.id}" aria-current="${c.id === sel}">
    <b>${c.id}</b> · ${esc(c.program)} · ${c.urgency}<br>
    ${s.flags.map((f) => `<span class="tag ${f}">${f}</span>`).join('')}
    <small>Next: ${esc(s.nextLabel)} · ${esc(s.owner ?? 'no owner (' + s.role + ')')} · due ${day(s.dueAt)}</small></button>`).join('');
  if (sel) detail(cases.find((c) => c.id === sel));
}

function detail(c) {
  const s = status(c, NOW);
  const done = new Map(c.events.map((e) => [e.step, e]));
  const tl = STEPS.map((st) => {
    const e = st.id === 'issued' ? { at: c.issuedAt, by: c.program } : done.get(st.id);
    const cls = e ? 'done' : st.id === s.next ? 'now' : '';
    const who = e ? `${day(e.at)} · ${esc(e.by ?? '')}${e.evidence ? ' · ' + esc(e.evidence) : ''}`
      : st.id === s.next ? `due ${day(s.dueAt)} · ${esc(s.owner ?? 'UNASSIGNED: ' + st.owner)}` : esc(c.owner?.[st.id] ?? st.owner);
    return `<li class="${cls}">${esc(st.label)}<br><small>${who}</small></li>`;
  }).join('');
  const check = canClose(c);
  const msg = patientMessage(c, NOW, c.lang);
  $('#detail').innerHTML = `<h2>${c.id} · ${esc(c.finding)} → ${esc(c.confirm)} → ${esc(c.specialist)} (${c.urgency})</h2>
    <ol class="tl">${tl}</ol>
    ${msg ? `<h2 style="margin-top:14px">Message the patient sees (${c.lang === 'ar' ? 'Arabic' : 'English'})</h2><pre lang="${c.lang}">${esc(msg)}</pre>` : ''}
    <h2 style="margin-top:14px">Consultations</h2>
    ${(c.consults ?? []).map((q, i) => `<p>${esc(q.from)} → ${esc(q.to)}: ${esc(q.question)}<br><small class="note">${q.answer ? esc(q.answer) + ' · ' + esc(q.by) : `Waiting since ${day(q.at)}`}</small>
      ${q.answer ? '' : `<button class="act" data-answer="${i}">Record answer</button>`}</p>`).join('')}
    <p><button class="act alt" id="ask-nurse">Patient asked for a nurse</button> <button class="act alt" id="ask-spec">Ask ${esc(c.specialist)}</button></p>
    ${s.next ? `<p><button class="act" id="close" ${check.ok ? '' : 'disabled'}>Close case (clinician sign-off)</button>
      <span class="note">${check.ok ? 'All steps documented.' : 'Cannot close: ' + esc(check.reason)}</span></p>` : '<p class="note">Closed.</p>'}
    ${c.correction && !c.correction.reviewed ? `<p><b>The lab ${c.correction.status === 'cancelled' ? 'cancelled' : 'corrected'} this result${c.correction.status === 'corrected' ? ` to "${esc(c.correction.value)}"` : ''}.</b> A clinician decides what happens to the case. <button class="act" id="reviewed">Mark reviewed by clinician</button></p>` : ''}
    <p><button class="act alt" id="export">Download this case as a FHIR R4 Bundle</button> <span class="note">Tasks, referral, messages, encounter, care plan and provenance. Passes the HL7 validator.</span></p>`;
  const put = (n) => { cases[cases.indexOf(c)] = n; render(c.id); };
  $('#ask-nurse')?.addEventListener('click', () => put(requestConsult(c, { kind: 'patient-to-clinician', from: 'Patient (replied 2)', to: c.owner?.acknowledged ?? 'Care navigator', question: 'Wants to talk to a nurse about the result' }, NOW)));
  $('#ask-spec')?.addEventListener('click', () => put(requestConsult(c, { kind: 'clinician-to-clinician', from: c.owner?.confirmatory ?? 'Primary care', to: c.specialist, question: `Is ${c.confirm} the right next step, or a direct referral?` }, NOW)));
  document.querySelectorAll('[data-answer]').forEach((b) => b.addEventListener('click', () => put(answerConsult(c, +b.dataset.answer, 'Answered and recorded on the case', c.consults[+b.dataset.answer].to, NOW))));
  $('#reviewed')?.addEventListener('click', () => put({ ...c, correction: { ...c.correction, reviewed: true } }));
  $('#export')?.addEventListener('click', () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(toFhirBundle(c, NOW), null, 2)], { type: 'application/fhir+json' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: `${c.id}.fhir.json` });
    a.click(); URL.revokeObjectURL(url);
  });
  $('#close')?.addEventListener('click', () => {
    const i = cases.indexOf(c);
    cases[i] = close(c, { name: c.owner?.closed ?? 'Case owner', clinician: true }, NOW);
    render(c.id);
  });
}

const FIT = '29771-3^Hemoglobin [Presence] in Stool from gastrointestinal lower by Immunoassay^LN';
const oru = (acc, code, type, value, st = 'F') => [
  `MSH|^~\\&|LAB|DEMOLAB|LOOPCLOSER|PROGRAM|20261115070000+0400||ORU^R01|MSG-${acc}|T|2.5.1`,
  'PID|1||PSEUDO-4471^^^PROGRAM^PI||||||||||||ara',
  `OBR|1||${acc}|${code}|||20261114100000+0400||||||||||||||20261115073000+0400|||${st}`,
  `OBX|1|${type}|${code}||${value}|||A|||${st}|||20261115073000+0400`,
].join('\n');
const HBA = JSON.stringify({ resourceType: 'Bundle', type: 'collection', meta: { tag: [{ code: 'HTEST' }] }, entry: [
  { fullUrl: 'urn:p', resource: { resourceType: 'Patient', identifier: [{ value: 'PSEUDO-9' }], communication: [{ language: { coding: [{ code: 'en' }] } }] } },
  { fullUrl: 'urn:o', resource: { resourceType: 'Observation', status: 'final', code: { coding: [{ system: 'http://loinc.org', code: '4548-4', display: 'Hemoglobin A1c/Hemoglobin.total in Blood' }] }, valueQuantity: { value: 7.9, unit: '%' } } },
  { fullUrl: 'urn:r', resource: { resourceType: 'DiagnosticReport', status: 'final', identifier: [{ value: 'HBA-501' }], code: { coding: [{ system: 'http://loinc.org', code: '4548-4' }] }, subject: { reference: 'urn:p' }, issued: '2026-11-15T07:30:00+04:00', result: [{ reference: 'urn:o' }] } },
] }, null, 1);
const MESSAGES = { hl7: oru('FIT-77120', FIT, 'CWE', 'Positive'), fhir: HBA, again: oru('FIT-77120', FIT, 'CWE', 'Positive'), corrected: oru('FIT-77120', FIT, 'CWE', 'Negative', 'C'), unknown: oru('LAB-9', '1234-5^Unlisted test^LN', 'ST', 'See report') };
const SAID = { opened: 'Opened a case', duplicate: 'Same accession number: no second case', corrected: 'Flag raised on the open case. It stays open until a clinician reviews it', 'needs-review': 'Sent to a person, never dropped', 'not-actionable': 'Recorded as not actionable' };
const seen = [];
let lastMessageAt = '2026-11-15T07:30:00Z';

$('#feed').addEventListener('click', (e) => {
  const kind = e.target.closest('[data-feed]')?.dataset.feed;
  if (!kind) return;
  const out = $('#feed-out'), pre = $('#feed-msg');
  document.body.dataset.feed = kind;
  if (kind === 'reconcile') {
    const { missing } = reconcile([...cases.filter((c) => c.accession).map((c) => c.accession), ...seen, 'FIT-77121'], cases, seen);
    const h = feedHealth(lastMessageAt, NOW);
    out.innerHTML = `<b>Lab list against cases:</b> ${missing.length} result${missing.length === 1 ? '' : 's'} issued and never received (${missing.map(esc).join(', ')}). They go to the coordinator so they cannot vanish. Feed last heard ${h.silentHours.toFixed(1)} h ago: ${h.stale ? 'STALE, alert' : 'healthy'}.`;
    pre.hidden = true;
    document.body.dataset.missing = missing.join(',');
    return;
  }
  const text = MESSAGES[kind];
  pre.textContent = text; pre.hidden = false;
  const [r] = parseMessage(text);
  const res = ingest(cases, r, NOW, routingFor);
  cases = res.cases;
  if (res.action === 'not-actionable' || res.action === 'needs-review') seen.push(r.accession);
  lastMessageAt = NOW;
  out.innerHTML = `<b>${esc(SAID[res.action])}.</b> ${esc(r.source === 'fhir' ? 'FHIR R4' : 'HL7 v2')} · ${esc(r.accession)} · ${esc(r.display ?? r.loinc ?? '')}: ${esc(r.value)}${res.reason ? ` · rule: ${esc(res.reason)}` : ''}`;
  document.body.dataset.lastAction = res.action;
  document.body.dataset.cases = String(cases.length);
  render(res.id ?? undefined);
});

$('#list').addEventListener('click', (e) => { const b = e.target.closest('.row'); if (b) render(b.dataset.id); });
render(worklist(cases, NOW)[0]?.c.id);
</script>
</body>
</html>
